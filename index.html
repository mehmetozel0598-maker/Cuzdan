<!doctype html>
<html lang="tr">
<head>

<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}[hidden]{display:none!important}

<style>
/* Layout: tek sütun mobil defter; üstte ay seçici, altta sabit sekme çubuğu, içerik kartları rol bazlı */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --sunk:#E3E9E6; --ink:#13201C; --muted:#5A6964; --line:#D3DCD8;
  --accent:#0D6A5B; --accent-ink:#FFFFFF; --gold:#A87C10;
  --ok:#1E7A46; --warn:#A35F00; --bad:#B3261E;
  --display:"Outfit",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#17201C; --sunk:#111916; --ink:#E5ECE9; --muted:#93A39D; --line:#2A3631;
  --accent:#4DC0A7; --accent-ink:#06231C; --gold:#E2B54C; --ok:#6BCB8C; --warn:#E9A64C; --bad:#F2847B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#17201C; --sunk:#111916; --ink:#E5ECE9; --muted:#93A39D; --line:#2A3631;
  --accent:#4DC0A7; --accent-ink:#06231C; --gold:#E2B54C; --ok:#6BCB8C; --warn:#E9A64C; --bad:#F2847B; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 110px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.35rem;font-weight:700}
h2{font-size:1.05rem;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.monthbar{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.monthbar span{min-width:112px;text-align:center;font-weight:600;font-size:.92rem}
.iconbtn{appearance:none;border:0;background:transparent;color:var(--ink);width:34px;height:34px;border-radius:999px;font-size:1.1rem;cursor:pointer}
.iconbtn:hover{background:var(--sunk)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hero{background:var(--accent);color:var(--accent-ink);border:0}
.hero .label{color:inherit;opacity:.8}
.big{font-family:var(--display);font-size:2.1rem;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.meter{height:10px;border-radius:99px;background:color-mix(in srgb,var(--accent-ink) 25%,transparent);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid currentColor}
.chip.ok{color:var(--ok)}.chip.warn{color:var(--warn)}.chip.bad{color:var(--bad)}
.hero .chip{color:var(--accent-ink);background:color-mix(in srgb,var(--accent-ink) 14%,transparent);border-color:transparent}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.row > div{min-width:0}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item .t{font-weight:500;overflow-wrap:anywhere}
.item .s{font-size:.8rem;color:var(--muted)}
.item .v{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
.tap{cursor:pointer;border-radius:8px}
.tap:hover .t{color:var(--accent)}
.group{display:flex;flex-direction:column;gap:4px}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-top:6px}
.ghead h3{font-size:.95rem;font-weight:600}
.bars{display:flex;align-items:flex-end;gap:5px;height:150px;padding-top:6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.bar i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:var(--accent);min-height:2px}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.bar small{font-size:.66rem;color:var(--muted);white-space:nowrap}
.bar.cur small{color:var(--ink);font-weight:700}
.hbar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.hbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;padding:10px 14px;border-radius:10px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.small{padding:6px 10px;font-size:.85rem}
.btn:focus-visible,.iconbtn:focus-visible,input:focus-visible,select:focus-visible,.navbtn:focus-visible,.tap:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.notice{border:1px dashed var(--gold);background:color-mix(in srgb,var(--gold) 9%,var(--surface));border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:.88rem}
.empty{color:var(--muted);font-size:.9rem;padding:6px 0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.navbtn{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:.72rem;font-weight:600;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.navbtn svg{width:22px;height:22px}
.navbtn[aria-current="page"]{color:var(--accent)}
.fab{align-self:flex-start}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));max-height:88%;max-height:88dvh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet .actions{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);margin-top:4px;padding-block:10px calc(12px + env(safe-area-inset-bottom,0px))}
.srcrows{display:flex;flex-direction:column;gap:8px}
.srcrow{display:grid;grid-template-columns:minmax(0,1fr) 7.5rem 34px;gap:6px;align-items:center}
.srcrow select{min-width:0;font-size:15px}
.srcrow input{text-align:right}
.paid{color:var(--ok);font-size:.78rem;font-weight:600;margin-top:2px}
.paybtn{margin-top:4px;padding:4px 10px;font-size:.8rem}
.formerr{color:var(--bad);font-weight:600;font-size:.9rem;border:1px solid color-mix(in srgb,var(--bad) 45%,var(--line));border-radius:10px;padding:8px 12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.82rem;font-weight:600;color:var(--muted)}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;padding-top:4px}
.actions .r{display:flex;gap:8px;margin-left:auto}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;appearance:none;border:0;background:transparent;font:inherit;font-weight:600;font-size:.85rem;color:var(--muted);padding:8px 4px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.hint{font-size:.8rem;color:var(--muted)}
.gold{color:var(--gold)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:.85rem;z-index:30}
@media (max-width:360px){.big{font-size:1.75rem}.grid2,.fields2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>


<div class="wrap" id="app"></div>
<nav class="tabs" aria-label="Bölümler"><div class="in" id="nav"></div></nav>
<div id="layer"></div>

<script>
(function(){
"use strict";
var KEY="cuzdan-defteri-v1";
var TR_MONTHS=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
var TR_SHORT=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
var CATS=["Market","Fatura","Kira","Ulaşım","Yemek","Sağlık","Eğitim","Giyim","Eğlence","Diğer"];
var ASSET_TYPES={TL:"Türk lirası",USD:"Dolar",EUR:"Euro",GRAM:"Gram altın",CEYREK:"Çeyrek altın",YARIM:"Yarım altın",TAM:"Tam altın",HISSE:"Hisse senedi"};
var ASSET_UNIT={TL:"₺",USD:"$",EUR:"€",GRAM:"gr",CEYREK:"adet",YARIM:"adet",TAM:"adet",HISSE:"lot"};
var GOLD=["GRAM","CEYREK","YARIM","TAM"];
var GOLD_NAME={GRAM:"gram",CEYREK:"çeyrek",YARIM:"yarım",TAM:"tam"};
var RATE_KEY={USD:"usd",EUR:"eur",GRAM:"gram",CEYREK:"ceyrek",YARIM:"yarim",TAM:"tam"};

function now(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function idx(ym){var p=ym.split("-");return (+p[0])*12+(+p[1])-1;}
function fromIdx(i){return Math.floor(i/12)+"-"+String(i%12+1).padStart(2,"0");}
function addM(ym,n){return fromIdx(idx(ym)+n);}
function mName(ym){var p=ym.split("-");return TR_MONTHS[+p[1]-1]+" "+p[0];}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmtDate(s){if(!s)return "";var p=String(s).split("-");if(p.length<3)return s;return (+p[2])+" "+TR_SHORT[+p[1]-1]+" "+p[0];}
function mShort(ym){var p=ym.split("-");return TR_SHORT[+p[1]-1];}
var fmtTL=new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:0});
var fmtN=new Intl.NumberFormat("tr-TR",{maximumFractionDigits:2});
function tl(v){return fmtTL.format(Math.round(v||0));}
function n(v){return fmtN.format(v||0);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function uid(){return Math.random().toString(36).slice(2,10);}
function num(v){if(typeof v==="number")return v;v=String(v||"").trim().replace(/[\s₺TLtl]/g,"");
  if(v.indexOf(",")>-1){v=v.replace(/\./g,"").replace(",",".");}
  else if(/^\d{1,3}(\.\d{3})+$/.test(v)){v=v.replace(/\./g,"");}
  return parseFloat(v)||0;}

function sample(){
  var c=now();
  var o={sample:true,
    rates:{usd:41.9,eur:48.7,gram:5400,ceyrek:8900,yarim:17800,tam:35500,updated:null},
    incomes:[{id:uid(),title:"Maaş",amount:85000,recurring:true},{id:uid(),title:"Ek ders ücreti",amount:6000,recurring:false,month:c}],
    debts:[
      {id:uid(),type:"kredi",bank:"Ziraat Bankası",title:"İhtiyaç kredisi",monthly:6450,start:addM(c,-7),count:24},
      {id:uid(),type:"kredi",bank:"Garanti BBVA",title:"Taşıt kredisi",monthly:9800,start:addM(c,-11),count:36},
      {id:uid(),type:"gun",bank:"",title:"Arkadaşlarla gün",monthly:1,start:addM(c,-5),count:12}
    ],
    cards:[
      {id:uid(),bank:"Akbank",name:"Axess",dueDay:5,plan:planOf(c,[11800,5200,4300,2750,2750])},
      {id:uid(),bank:"Yapı Kredi",name:"World",dueDay:17,plan:planOf(c,[14200,3100,3100])}
    ],
    expenses:[
      {id:uid(),month:c,day:3,cat:"Market",desc:"Haftalık alışveriş",amount:3850},
      {id:uid(),month:c,day:5,cat:"Fatura",desc:"Elektrik + doğalgaz",amount:2400},
      {id:uid(),month:c,day:8,cat:"Ulaşım",desc:"Akaryakıt",amount:3200},
      {id:uid(),month:c,day:11,cat:"Yemek",desc:"Dışarıda akşam yemeği",amount:1750}
    ],
    assets:[
      {id:uid(),kind:"TL",title:"Vadesiz hesap",qty:42000,price:0},
      {id:uid(),kind:"USD",title:"Döviz hesabı",qty:1500,price:0},
      {id:uid(),kind:"EUR",title:"Euro nakit",qty:800,price:0},
      {id:uid(),kind:"GRAM",title:"Altın hesabı",qty:25,price:0},
      {id:uid(),kind:"CEYREK",title:"Kasadaki çeyrekler",qty:4,price:0},
      {id:uid(),kind:"YARIM",title:"Düğün altını",qty:1,price:0},
      {id:uid(),kind:"TAM",title:"Düğün altını",qty:1,price:0},
      {id:uid(),kind:"HISSE",title:"Örnek hisse",qty:150,price:48.6}
    ]};
  o.payments=[{id:uid(),month:c,src:"inc:"+o.incomes[0].id,dst:"debt:"+o.debts[0].id,amount:6450,qty:0,note:""},
    {id:uid(),month:c,src:"ast:"+o.assets[0].id,dst:"card:"+o.cards[0].id,amount:11800,qty:11800,note:""}];
  o.assets[0].qty-=11800;
  var g=uid();o.savings=[{id:uid(),grp:g,month:c,src:"inc:"+o.incomes[0].id,amount:10800,srcQty:0,kind:"GRAM",target:o.assets[3].id,newTitle:"",price:5400,qty:2,status:"plan",note:""}];
  return o;
}
function planOf(start,arr){var p={};arr.forEach(function(a,i){p[addM(start,i)]=a;});return p;}
function blank(){return {sample:false,rates:{usd:0,eur:0,gram:0,ceyrek:0,yarim:0,tam:0,updated:null},incomes:[],debts:[],cards:[],expenses:[],assets:[],payments:[],savings:[]};}
function normalize(s){var b=blank();if(!s||typeof s!=="object")return b;s=JSON.parse(JSON.stringify(s));for(var k in b){if(s[k]!==undefined)b[k]=s[k];}b.rates=Object.assign(blank().rates,s.rates||{});
  // eski "kart" taksitlerini kart planına taşı
  var old=b.debts.filter(function(d){return d.type==="kart";});
  if(old.length){old.forEach(function(d){var c=b.cards.filter(function(x){return x.bank===d.bank;})[0];if(!c){c={id:uid(),bank:d.bank||"Kart",name:"",dueDay:"",plan:{}};b.cards.push(c);}
    for(var i=0;i<d.count;i++){var ym=addM(d.start,i);c.plan[ym]=Math.round(((c.plan[ym]||0)+d.monthly)*100)/100;}});
    b.debts=b.debts.filter(function(d){return d.type!=="kart";});}
  return b;}

var S=null, view={tab:"ozet",month:now(),debtFilter:"hepsi"};
try{var raw=localStorage.getItem(KEY);if(raw)S=normalize(JSON.parse(raw));}catch(e){}
try{var t=localStorage.getItem(KEY+":tab");if(t)view.tab=t;}catch(e){}
if(!S)S=sample();
var store="yerel", dbRef=null, writing=Promise.resolve(), saveTimer=null, dirty=false, lastDbErr="";

function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(!dbRef)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    var body=JSON.parse(JSON.stringify(S));
    writing=writing.then(function(){return dbRef.set(body);}).catch(function(e){
      if(e&&e.code==="unavailable"){return new Promise(function(r){setTimeout(r,800+Math.random()*700);}).then(function(){return dbRef.set(body);}).catch(function(){});}
      lastDbErr=(e&&(e.code||e.message))||"bilinmiyor";
      toast("Bilgin bu telefona kaydedildi, hesaba yazılamadı ("+lastDbErr+").");
    });
  },700);
}
function commit(){persist();render();}

/* --- hesaplar --- */
function gunUnit(d){return d.unit||"CEYREK";}
function debtTL(d){return d.type==="gun"?d.monthly*(S.rates[RATE_KEY[gunUnit(d)]]||0):d.monthly;}
function activeIn(d,ym){var i=idx(ym),s=idx(d.start);return i>=s&&i<s+d.count;}
function paidBefore(d,ym){return Math.max(0,Math.min(d.count,idx(ym)-idx(d.start)));}
function remainingCount(d,ym){return d.count-paidBefore(d,ym);}
function cardIn(c,ym){return +((c.plan||{})[ym])||0;}
function cardFrom(c,ym){var i=idx(ym),t=0;for(var k in (c.plan||{})){if(idx(k)>=i)t+=+c.plan[k]||0;}return t;}
function cardsLoad(ym){return (S.cards||[]).reduce(function(a,c){return a+cardIn(c,ym);},0);}
function debtLoad(ym,type){var d=S.debts.filter(function(d){return (!type||d.type===type)&&activeIn(d,ym);}).reduce(function(a,d){return a+debtTL(d);},0);return d+((!type||type==="kart")?cardsLoad(ym):0);}
function remainingTotal(ym,type){var d=S.debts.filter(function(d){return !type||d.type===type;}).reduce(function(a,d){return a+Math.max(0,remainingCount(d,ym))*debtTL(d);},0);
  if(!type||type==="kart")d+=(S.cards||[]).reduce(function(a,c){return a+cardFrom(c,ym);},0);
  d-=paidCapped(function(p){return idx(p.month)>=idx(ym)&&(!type||dstType(p.dst)===type);});return Math.max(0,d);}
/* --- ödemeler --- */
function splitRef(r){var i=r.indexOf(":");return [r.slice(0,i),r.slice(i+1)];}
function dueOf(dst,ym){var p=splitRef(dst);if(p[0]==="card"){var c=find(S.cards,p[1]);return c?cardIn(c,ym):0;}var d=find(S.debts,p[1]);return d&&activeIn(d,ym)?debtTL(d):0;}
function dstType(dst){var p=splitRef(dst);if(p[0]==="card")return "kart";var d=find(S.debts,p[1]);return d?d.type:"";}
function dstName(dst){var p=splitRef(dst);if(p[0]==="card"){var c=find(S.cards,p[1]);return c?c.bank+(c.name?" "+c.name:"")+" kartı":"Silinmiş kart";}
  var d=find(S.debts,p[1]);return d?(d.bank?d.bank+" · ":"")+d.title:"Silinmiş borç";}
function srcName(src){var p=splitRef(src);if(p[0]==="inc"){var x=find(S.incomes,p[1]);return x?x.title:"Silinmiş gelir";}
  var a=find(S.assets,p[1]);return a?(a.title||ASSET_TYPES[a.kind]):"Silinmiş varlık";}
function paidFor(dst,ym,except){return (S.payments||[]).filter(function(p){return p.dst===dst&&p.month===ym&&p.id!==except;}).reduce(function(a,p){return a+(+p.amount||0);},0);}
function paidFromSrc(src,ym){return (S.payments||[]).filter(function(p){return p.src===src&&p.month===ym;}).reduce(function(a,p){return a+(+p.amount||0);},0);}
function paidCapped(test){var g={};(S.payments||[]).forEach(function(p){if(!test(p))return;var k=p.dst+"|"+p.month;g[k]=(g[k]||0)+(+p.amount||0);});
  var t=0;for(var k in g){var q=k.split("|");t+=Math.min(g[k],dueOf(q[0],q[1]));}return t;}
function unitPrice(a){if(!a)return 0;if(a.kind==="TL")return 1;if(a.kind==="HISSE")return +a.price||0;return S.rates[RATE_KEY[a.kind]]||0;}
function undoAsset(p){if(p&&p.src&&p.src.indexOf("ast:")===0&&p.qty){var a=find(S.assets,p.src.slice(4));if(a)a.qty=Math.round((a.qty+p.qty)*1e6)/1e6;}}
function applyAsset(p){if(p&&p.src&&p.src.indexOf("ast:")===0&&p.qty){var a=find(S.assets,p.src.slice(4));if(a)a.qty=Math.round((a.qty-p.qty)*1e6)/1e6;}}
/* --- birikim --- */
var SAVE_KINDS=["GRAM","CEYREK","YARIM","TAM","USD","EUR","HISSE","TL"];
function r6(x){return Math.round(x*1e6)/1e6;}
function savedFromSrc(src,ym,st){return (S.savings||[]).filter(function(x){return x.src===src&&x.month===ym&&(!st||x.status===st);}).reduce(function(a,x){return a+(+x.amount||0);},0);}
function expParts(x){return x.parts||(x.src?[{src:x.src,amount:+x.amount,srcQty:x.srcQty||0}]:[]);}
function expPaid(x){return expParts(x).reduce(function(a,p){return a+(+p.amount||0);},0);}
function expUnpaid(x){return Math.max(0,(+x.amount||0)-expPaid(x));}
function spentFromSrc(src,ym){return S.expenses.filter(function(x){return x.month===ym;}).reduce(function(a,x){return a+expParts(x).filter(function(p){return p.src===src;}).reduce(function(b,p){return b+(+p.amount||0);},0);},0);}
function usedFromSrc(src,ym){return paidFromSrc(src,ym)+savedFromSrc(src,ym,"done")+spentFromSrc(src,ym);}
function expApply(x,sign){if(!x)return;expParts(x).forEach(function(p){if(p.src.indexOf("ast:")===0&&p.srcQty){var a=find(S.assets,p.src.slice(4));if(a)a.qty=r6(a.qty-sign*p.srcQty);}});}
var lastExpSrc="";
function saveApply(x,sign){if(x.status!=="done")return;
  if(x.src.indexOf("ast:")===0&&x.srcQty){var a=find(S.assets,x.src.slice(4));if(a)a.qty=r6(a.qty-sign*x.srcQty);}
  var t=find(S.assets,x.target);if(t){t.qty=r6(t.qty+sign*x.qty);if(t.kind!=="TL"){t.cost=Math.round(((+t.cost||0)+sign*x.amount)*100)/100;t.costQty=r6((+t.costQty||0)+sign*x.qty);if(t.costQty<=1e-9||t.cost<=0.005){t.cost=0;t.costQty=0;}}}}
function gainOf(a){if(!(a.cost>0&&a.costQty>0)||a.kind==="TL")return null;var cur=a.costQty*unitPrice(a);return {cost:a.cost,cur:cur,diff:cur-a.cost,pct:(cur-a.cost)/a.cost*100,unitCost:a.cost/a.costQty};}
function gainHtml(g){if(!g)return "";var c=g.diff>=0?"var(--ok)":"var(--bad)",s=g.diff>=0?"+":"−";return '<div class="s">alış '+tl(g.cost)+' · şimdi '+tl(g.cur)+' · <b style="color:'+c+'">'+s+tl(Math.abs(g.diff))+' ('+s+'%'+n(Math.round(Math.abs(g.pct)*10)/10)+')</b></div>';}
function availOf(src,m,back){var p=splitRef(src),b=back?back(src):0;
  if(p[0]==="inc"){var x=find(S.incomes,p[1]);return x?(+x.amount-usedFromSrc(src,m)+b):0;}
  var a=find(S.assets,p[1]);return a?assetTL(a)+b:0;}
function overdraw(rows,m,back){var agg={},out=[];rows.forEach(function(r){if(r.amount>0)agg[r.src]=(agg[r.src]||0)+r.amount;});
  for(var s in agg){var av=availOf(s,m,back);if(agg[s]>av+0.5)out.push({src:s,avail:av,want:agg[s]});}return out;}
function overMsg(ov){return ov.map(function(o){return srcName(o.src)+" kaynağında "+tl(Math.max(0,o.avail))+" var, "+tl(o.want)+" yazdın.";}).join(" ");}
function overText(rows,m,back){var ov=overdraw(rows,m,back);return ov.length?'<div style="color:var(--bad);font-weight:600">Yetersiz bakiye: '+esc(overMsg(ov))+'</div>':'';}
function kindPrice(k,lot){if(k==="TL")return 1;if(k==="HISSE")return +lot||0;return S.rates[RATE_KEY[k]]||0;}
function qtyText(k,q){if(k==="TL")return tl(q)+" TL birikim";if(k==="USD")return n(q)+" $";if(k==="EUR")return n(q)+" €";if(k==="HISSE")return n(q)+" lot hisse";
  if(k==="GRAM")return n(q)+" gram altın";return n(q)+" "+GOLD_NAME[k]+" altın";}
function incomeIn(ym){return S.incomes.filter(function(x){return x.recurring||x.month===ym;}).reduce(function(a,x){return a+(+x.amount||0);},0);}
function spentIn(ym){return S.expenses.filter(function(x){return x.month===ym;}).reduce(function(a,x){return a+(+x.amount||0);},0);}
function assetTL(a){if(a.kind==="TL")return a.qty;if(a.kind==="HISSE")return a.qty*(a.price||0);return a.qty*(S.rates[RATE_KEY[a.kind]]||0);}
function assetsTotal(){return S.assets.reduce(function(a,x){return a+assetTL(x);},0);}
function ratioClass(r){return r<.35?"ok":r<.5?"warn":"bad";}
function ratioText(r){return r<.35?"Sağlıklı":r<.5?"Dikkat":"Yüksek";}
function ratesMissing(){var need={};S.assets.forEach(function(a){if(RATE_KEY[a.kind])need[RATE_KEY[a.kind]]=1;});S.debts.forEach(function(d){if(d.type==="gun")need[RATE_KEY[gunUnit(d)]]=1;});
  for(var k in need){if(!S.rates[k])return true;}return false;}

  var sg=[],sgi={};svs.forEach(function(x){var k=x.grp||x.id;if(!sgi[k]){sgi[k]={first:x,items:[]};sg.push(sgi[k]);}sgi[k].items.push(x);});

function rowLine(a,b){return '<div class="item"><div class="t">'+a+'</div><div class="v">'+b+'</div></div>';}
function perspective(G,B,H,K){
  if(G<=0)return "Bu ay için gelir girilmemiş. Gelir-Gider sekmesinden maaşını ekle, oranlar hesaplansın.";
  var s="Gelirinin %"+Math.round(Math.max(0,K)/G*100)+"'ini biriktirebilirsin. ";
  if(K<0)s="Bu ay giderler geliri "+tl(-K)+" aşıyor. ";
  var r=B/G;
  if(r>=.5)s+="Taksitler gelirin yarısını geçmiş; yeni borç almadan önce bitecek taksitleri bekle.";
  else if(r>=.35)s+="Taksit yükü sınıra yakın; yeni taksitli alışverişi bitecek bir taksitle dengelemek iyi olur.";
  else s+="Taksit yükün makul seviyede.";
  return s;
}
function drops(m){
  var ends=S.debts.filter(function(d){var last=addM(d.start,d.count-1);return idx(last)>=idx(m)&&idx(last)<idx(m)+12&&d.count>1;})
    .map(function(d){return {d:d,last:addM(d.start,d.count-1)};}).sort(function(a,b){return idx(a.last)-idx(b.last);});
  if(!ends.length)return "";
  return '<div class="list">'+ends.map(function(e){return '<div class="item"><div><div class="t">'+esc(e.d.title)+'</div><div class="s">'+(e.d.bank?esc(e.d.bank)+' · ':'')+'son taksit '+mName(e.last)+'</div></div><div class="v muted">−'+tl(debtTL(e.d))+'/ay</div></div>';}).join("")+'</div>';
}

  var names=ps.map(function(p){return esc(srcName(p.src));}).join(" + ");
  return u>0.5?'<div class="s" style="color:var(--warn);font-weight:600">'+names+' · kalan '+tl(u)+'</div>':'<div class="paid">✓ '+names+'</div>';}
function expenseForm(x){
  var isNew=!x;var today=new Date();x=x||{month:view.month,day:view.month===now()?today.getDate():"",cat:"Market",desc:"",amount:""};
  var old=expParts(x);
  function back(s){return old.filter(function(p){return p.src===s;}).reduce(function(a,p){return a+(+p.amount||0);},0);}
  var srcs=[];
  S.incomes.forEach(function(y){if(y.recurring||y.month===x.month)srcs.push(["inc:"+y.id,"Gelir · "+y.title+" (kalan "+tl(+y.amount-usedFromSrc("inc:"+y.id,x.month)+back("inc:"+y.id))+")"]);});
  S.assets.forEach(function(a){srcs.push(["ast:"+a.id,ASSET_TYPES[a.kind]+" · "+(a.title||"")+" ("+tl(assetTL(a)+back("ast:"+a.id))+")"]);});
  function rowHtml(src,amt){return '<div class="srcrow"><select class="ps" aria-label="Kaynak">'+srcs.map(function(o){return '<option value="'+esc(o[0])+'"'+(o[0]===src?" selected":"")+'>'+esc(o[1])+'</option>';}).join("")+'</select><input class="pa" inputmode="decimal" aria-label="Bu kaynaktan ödenen" placeholder="Tutar" value="'+(amt?String(Math.round(amt*100)/100).replace(".",","):"")+'"><button type="button" class="iconbtn rm" aria-label="Kaynağı kaldır">✕</button></div>';}
  var body='<div class="fields2">'+sel("e-cat","Kategori",CATS.map(function(c){return [c,c];}),x.cat)+fld("e-day","Gün ("+TR_MONTHS[+x.month.split("-")[1]-1]+")",x.day,"num",'placeholder="isteğe bağlı"')+'</div>'+fld("e-desc","Açıklama",x.desc,"text",'placeholder="Örn. Haftalık market"')+fld("e-amount","Tutar (₺)",x.amount,"num");
  body+='<div class="field"><label>Nereden ödendi?</label><div id="eRows" class="srcrows">'+old.map(function(p){return rowHtml(p.src,p.amount);}).join("")+'</div>'
    +(srcs.length?'<button type="button" class="btn small" id="eAddSrc" style="align-self:flex-start">+ Ödeme kaynağı ekle</button>':'')+'</div><div class="notice" id="eSum" style="border-style:solid"></div>';
  function readRows(){return Array.prototype.map.call(document.querySelectorAll("#eRows .srcrow"),function(r){return {src:r.querySelector(".ps").value,amount:num(r.querySelector(".pa").value)};});}
  function sum(){var t=readRows().reduce(function(a,r){return a+r.amount;},0),amt=num(document.getElementById("e-amount").value),box=document.getElementById("eSum");
    box.innerHTML=(!readRows().length?'<span style="color:var(--warn);font-weight:600">Henüz ödenmedi.</span> <span class="muted">Ay sonu hesabında ödenecek olarak görünür. Ödediysen kaynak ekle.</span>'
      :t<amt-0.5?'<div>Ödenen <b>'+tl(t)+'</b> · ödenmemiş kalan <b>'+tl(amt-t)+'</b></div>':t>amt+0.5?'<div class="gold">Kaynaklardan girilen toplam, harcamadan '+tl(t-amt)+' fazla.</div>':'<div style="color:var(--ok);font-weight:600">✓ Tamamı ödendi</div>')
      +overText(readRows(),x.month,back);}
  sheet(isNew?"Harcama ekle":"Harcamayı düzenle",body,function(f){
    var d=Math.round(num(v(f,"e-day"))),amt=num(v(f,"e-amount"));
    if(!(amt>0))return "Tutar 0'dan büyük olmalı.";
    var rs=readRows().filter(function(r){return r.amount>0;}),t=rs.reduce(function(a,r){return a+r.amount;},0);
    if(t>amt+0.5)return "Kaynaklardan girilen toplam ("+tl(t)+") harcamadan fazla.";
    var ov=overdraw(rs,x.month,back);if(ov.length)return "Yetersiz bakiye: "+overMsg(ov);
    for(var i=0;i<rs.length;i++){rs[i].srcQty=0;if(rs[i].src.indexOf("ast:")===0){var up=unitPrice(find(S.assets,rs[i].src.slice(4)));if(!(up>0))return srcName(rs[i].src)+" için fiyat girilmemiş.";rs[i].srcQty=rs[i].amount/up;}}
    var nx={id:x.id||uid(),month:x.month,day:d>=1&&d<=31?d:"",cat:v(f,"e-cat"),desc:v(f,"e-desc"),amount:amt,parts:rs};
    if(!isNew)expApply(x,-1);expApply(nx,1);if(rs.length)lastExpSrc=rs[0].src;
    if(isNew)S.expenses.push(nx);else S.expenses[S.expenses.findIndex(function(y){return y.id===x.id;})]=nx;
  },isNew?null:function(){expApply(x,-1);S.expenses=S.expenses.filter(function(y){return y.id!==x.id;});});
  var rowsEl=document.getElementById("eRows"),add=document.getElementById("eAddSrc");
  if(add)add.addEventListener("click",function(){var rs=readRows(),used=rs.map(function(r){return r.src;}),t=rs.reduce(function(a,r){return a+r.amount;},0),amt=num(document.getElementById("e-amount").value);
    var pref=!rs.length&&lastExpSrc&&srcs.some(function(s){return s[0]===lastExpSrc;})?lastExpSrc:(srcs.filter(function(s){return used.indexOf(s[0])<0;})[0]||srcs[0])[0];
    var want=Math.max(0,amt-t),av=availOf(pref,x.month,back);if(rs.length===0||want>0)want=Math.min(want,Math.max(0,av))||want;
    rowsEl.insertAdjacentHTML("beforeend",rowHtml(pref,want));sum();});
  rowsEl.addEventListener("click",function(e){var b=e.target.closest(".rm");if(!b)return;b.parentNode.remove();sum();});
  document.getElementById("sheetForm").addEventListener("input",sum);document.getElementById("sheetForm").addEventListener("change",sum);
  sum();
}
function assetForm(a){
  var isNew=!a;a=a||{kind:"TL",title:"",qty:"",price:"",date:today()};
  var body=sel("a-kind","Tür",Object.keys(ASSET_TYPES).map(function(k){return [k,ASSET_TYPES[k]];}),a.kind)+fld("a-title","Açıklama",a.title,"text",'placeholder="Örn. Vadesiz hesap, kasadaki altın"')
   +'<div id="pcsWrap"'+(a.kind==="GRAM"?"":" hidden")+'><div class="fields2">'+fld("a-pcs","Adet",a.pcs||"","num",'placeholder="Örn. 3"')+fld("a-unit","Birim gram (1 adedi)",a.unitG||"","num",'placeholder="Örn. 5"')+'</div><div class="hint">Adet ve birim gramı yazarsan toplam gram kendiliğinden hesaplanır (3 adet × 5 gr = 15 gr). Boş bırakıp toplam gramı da yazabilirsin.</div></div>'
   +'<div class="fields2">'+fld("a-qty",qtyLabel(a.kind),a.qty,"num")+'<div id="priceWrap"'+(a.kind==="HISSE"?"":" hidden")+'>'+fld("a-price","Lot fiyatı (₺)",a.price,"num")+'</div></div>'+'<div class="fields2">'+fld("a-date","Alış tarihi",a.date||"","date")+'<div id="costWrap"'+(a.kind==="TL"?" hidden":"")+'>'+fld("a-cost","Alış tutarı (toplam ₺)",a.cost||"","num",'placeholder="isteğe bağlı"')+'</div></div><div class="hint" id="assetHint">'+assetHint(a.kind)+'</div>';
  var cm=now(),srcOpts=[["","Zaten elimde (bir yerden düşme)"]];
  S.incomes.forEach(function(y){if(y.recurring||y.month===cm)srcOpts.push(["inc:"+y.id,"Gelir · "+y.title+" (kalan "+tl(+y.amount-usedFromSrc("inc:"+y.id,cm))+")"]);});
  S.assets.forEach(function(x){if(x.id!==a.id)srcOpts.push(["ast:"+x.id,ASSET_TYPES[x.kind]+" · "+(x.title||"")+" ("+tl(assetTL(x))+")"]);});
  if(isNew)body+=sel("a-src","Nereden alındı?",srcOpts,"")+'<div class="notice" id="aBuy" style="border-style:solid" hidden></div>';
  else body+='<button type="button" class="btn small" id="aBuyMore" style="align-self:flex-start">+ Bu varlığa maaştan / hesaptan alım ekle</button>';
  sheet(isNew?"Varlık ekle":"Varlığı düzenle",body,function(f){
    var na={id:a.id||uid(),kind:v(f,"a-kind"),title:v(f,"a-title"),qty:num(v(f,"a-qty")),price:num(v(f,"a-price")),date:v(f,"a-date")};
    var pc=num(v(f,"a-pcs")),ug=num(v(f,"a-unit"));
    if(na.kind==="GRAM"&&pc>0&&ug>0){na.pcs=pc;na.unitG=ug;na.qty=r6(pc*ug);}
    var cst=na.kind==="TL"?0:num(v(f,"a-cost"));
    if(cst>0){na.cost=cst;na.costQty=(!isNew&&cst===+a.cost&&na.qty===+a.qty&&a.costQty)?a.costQty:na.qty;}else{na.cost=0;na.costQty=0;}
    var bsrc=isNew?v(f,"a-src"):"";
    if(bsrc){var bp=kindPrice(na.kind,na.price);if(!(bp>0)&&!(cst>0))return ASSET_TYPES[na.kind]+" fiyatı girilmemiş; önce Kurlar sekmesinden gir.";
      if(!(na.qty>0))return "Miktar 0'dan büyük olmalı.";
      var amt=cst>0?cst:Math.round(na.qty*bp*100)/100,ov=overdraw([{src:bsrc,amount:amt}],cm);if(ov.length)return "Yetersiz bakiye: "+overMsg(ov);
      var sx={id:uid(),grp:uid(),month:cm,src:bsrc,amount:amt,srcQty:0,kind:na.kind,target:na.id,newTitle:"",price:na.kind==="HISSE"?na.price:0,qty:na.qty,status:"done",note:"",date:na.date||today()};
      if(bsrc.indexOf("ast:")===0){var up=unitPrice(find(S.assets,bsrc.slice(4)));if(!(up>0))return srcName(bsrc)+" için fiyat girilmemiş.";sx.srcQty=amt/up;}
      na.qty=0;na.cost=0;na.costQty=0;S.assets.push(na);saveApply(sx,1);S.savings.push(sx);return;}
    if(!(na.qty>0))return "Miktar 0'dan büyük olmalı.";
    if(na.kind==="HISSE"&&!(na.price>0))return "Hisse için lot fiyatını yaz.";
    if(isNew)S.assets.push(na);else S.assets[S.assets.findIndex(function(y){return y.id===a.id;})]=na;
  },isNew?null:function(){S.assets=S.assets.filter(function(y){return y.id!==a.id;});});
  function calcG(){var pc=num(document.getElementById("a-pcs").value),ug=num(document.getElementById("a-unit").value);if(pc>0&&ug>0)document.getElementById("a-qty").value=String(r6(pc*ug)).replace(".",",");buyInfo();}
  function buyInfo(){var box=document.getElementById("aBuy"),s=document.getElementById("a-src");if(!box||!s)return;if(!s.value){box.hidden=true;return;}box.hidden=false;
    var k=document.getElementById("a-kind").value,q=num(document.getElementById("a-qty").value),p=kindPrice(k,num(document.getElementById("a-price").value));
    var cst=num(document.getElementById("a-cost").value);
    if(!(p>0)&&!(cst>0)){box.innerHTML='<span class="gold">'+ASSET_TYPES[k]+' fiyatı girilmemiş; önce Kurlar sekmesinden gir.</span>';return;}
    var amt=cst>0?cst:q*p;box.innerHTML='<div>'+(q>0?qtyText(k,q)+' = <b>'+tl(amt)+'</b>, '+esc(srcName(s.value))+' kaynağından düşülecek.':'Miktarı yaz, tutar hesaplansın.')+'</div>'+overText([{src:s.value,amount:amt}],cm);}
  document.getElementById("sheetForm").addEventListener("input",buyInfo);document.getElementById("sheetForm").addEventListener("change",buyInfo);
  var bm=document.getElementById("aBuyMore");if(bm)bm.addEventListener("click",function(){saveForm(null,{kind:a.kind,target:a.id,status:"done",price:a.kind==="HISSE"?a.price:""});});
  document.getElementById("a-pcs").addEventListener("input",calcG);document.getElementById("a-unit").addEventListener("input",calcG);
  document.getElementById("a-kind").addEventListener("change",function(e){var k=e.target.value;document.getElementById("pcsWrap").hidden=k!=="GRAM";document.getElementById("costWrap").hidden=k==="TL";document.querySelector('label[for="a-qty"]').textContent=qtyLabel(k);document.getElementById("priceWrap").hidden=k!=="HISSE";document.getElementById("assetHint").textContent=assetHint(k);});
}
function qtyLabel(k){return {TL:"Tutar (₺)",USD:"Miktar ($)",EUR:"Miktar (€)",GRAM:"Gram",CEYREK:"Adet",YARIM:"Adet",TAM:"Adet",HISSE:"Lot sayısı"}[k];}
function assetHint(k){return k==="TL"?"TL olarak doğrudan toplanır.":k==="HISSE"?"Lot sayısı × lot fiyatı. Fiyatı değiştikçe bu kaydı düzenle.":"TL karşılığı Kurlar sekmesindeki fiyattan hesaplanır.";}

/* --- olaylar --- */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var a=el.dataset.act;
  if(a==="closeBg"&&e.target!==el)return;
  switch(a){
    case"mprev":view.month=addM(view.month,-1);render();break;
    case"mnext":view.month=addM(view.month,1);render();break;
    case"tab":view.tab=el.dataset.tab;try{localStorage.setItem(KEY+":tab",view.tab);}catch(x){}render();window.scrollTo(0,0);break;
    case"goto":view.tab=el.dataset.tab;render();window.scrollTo(0,0);break;
    case"dfilter":view.debtFilter=el.dataset.v;render();break;
    case"addDebt":debtForm(null,el.dataset.type);break;
    case"editDebt":debtForm(find(S.debts,el.dataset.id));break;
    case"addSave":saveForm(null);break;
    case"editSave":saveForm(find(S.savings,el.dataset.id));break;
    case"addPay":payForm(null);break;
    case"pay":payForm(null,el.dataset.dst);break;
    case"editPay":payForm(find(S.payments,el.dataset.id));break;
    case"addCard":cardForm(null);break;
    case"editCard":cardForm(find(S.cards,el.dataset.id));break;
    case"planCard":cardPlanForm(find(S.cards,el.dataset.id));break;
    case"addIncome":incomeForm(null);break;
    case"editIncome":incomeForm(find(S.incomes,el.dataset.id));break;
    case"addExpense":expenseForm(null);break;
    case"editExpense":expenseForm(find(S.expenses,el.dataset.id));break;
    case"addAsset":assetForm(null);break;
    case"editAsset":assetForm(find(S.assets,el.dataset.id));break;
    case"close":case"closeBg":closeSheet();break;
    case"clearSample":S=blank();dirty=true;commit();toast("Örnekler silindi. Önce Kurlar sekmesinden fiyatları gir.");break;
    case"saveRates":
      ["usd","eur","gram","ceyrek","yarim","tam"].forEach(function(k){S.rates[k]=num(document.getElementById("rate-"+k).value);});
      S.rates.updated=new Date().toISOString();dirty=true;commit();toast("Kurlar kaydedildi");break;
    case"wipe":document.getElementById("wipe").innerHTML='<div class="row" style="flex-wrap:wrap"><span class="hint">Tüm gelir, borç, harcama ve varlık kayıtların silinecek.</span><span style="display:flex;gap:8px"><button class="btn small" data-act="wipeNo">Vazgeç</button><button class="btn danger small" data-act="wipeYes">Evet, sil</button></span></div>';break;
    case"wipeNo":render();break;
    case"backup":(function(){var name="cuzdan-yedek-"+today()+".json",blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
      try{var f=new File([blob],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:"Cüzdan Defteri yedeği"}).catch(function(){});return;}}catch(e){}
      var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);toast("Yedek indirildi: "+name);})();break;
    case"restore":document.getElementById("restoreFile").click();break;
    case"wipeYes":S=blank();dirty=true;commit();toast("Tüm veriler silindi");break;
  }
});
document.addEventListener("change",function(e){if(!e.target||e.target.id!=="restoreFile"||!e.target.files[0])return;var r=new FileReader();
  r.onload=function(){try{var o=JSON.parse(r.result);if(!o||typeof o!=="object"||!Array.isArray(o.assets))throw 0;S=normalize(o);S.sample=false;commit();toast("Yedek yüklendi");}catch(x){toast("Bu dosya bir Cüzdan Defteri yedeği değil.");}};
  r.readAsText(e.target.files[0]);e.target.value="";});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&layer.innerHTML){closeSheet();return;}
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("tap")){e.preventDefault();e.target.click();}
});
function find(arr,id){return arr.filter(function(x){return x.id===id;})[0];}
var tt;function toast(m){var d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.textContent=m;document.body.appendChild(d);clearTimeout(tt);tt=setTimeout(function(){d.remove();},2600);}

var ICONS={
  ozet:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2" />',
  borc:'<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6.5 15h4"/>',
  gg:'<path d="M7 4v16M3.5 7.5 7 4l3.5 3.5M17 20V4M13.5 16.5 17 20l3.5-3.5"/>',
  varlik:'<path d="M3 9.5 12 4l9 5.5M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20.5h18"/>',
  kurlar:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7v10M9.5 9.5c0-1.2 1.1-2 2.5-2s2.5.8 2.5 2-1.1 1.7-2.5 2-2.5.8-2.5 2 1.1 2 2.5 2 2.5-.8 2.5-2"/>'
};
function renderNav(){
  var tabs=[["ozet","Özet"],["borc","Borçlar"],["gg","Gelir-Gider"],["varlik","Varlıklar"],["kurlar","Kurlar"]];
  document.getElementById("nav").innerHTML=tabs.map(function(t){return '<button class="navbtn" data-act="tab" data-tab="'+t[0]+'"'+(view.tab===t[0]?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[t[0]]+'</svg>'+t[1]+'</button>';}).join("");
}
function render(){
  var f={ozet:renderOzet,borc:renderBorc,gg:renderGG,varlik:renderVarlik,kurlar:renderKurlar}[view.tab]||renderOzet;
  app.innerHTML=f();renderNav();
}
render();
